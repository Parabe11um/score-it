name: Django tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Django and migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: python manage.py test poker.tests --verbosity 2
      - name: Verify release compatibility and rejection cases
        run: python -m unittest discover -s tests -p 'test_release_verification.py' -v

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: score_it_ci
          POSTGRES_USER: score_it_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U score_it_ci -d score_it_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_ENGINE: postgresql
      DB_HOST: 127.0.0.1
      POSTGRES_DB: score_it_ci
      POSTGRES_USER: score_it_ci
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install production dependencies
        run: python -m pip install -r requirements.production.txt
      - name: Transfer SQLite data to a real PostgreSQL database
        run: python tests/check_sqlite_postgres_transfer.py
      - name: Check models and run PostgreSQL tests
        run: |
          python manage.py check --database default
          python manage.py makemigrations --check --dry-run
          python manage.py test poker.tests --verbosity 2
      - name: Build, load and run the release without external container networking
        run: |
          bash deploy/make_release.sh "$RUNNER_TEMP/releases"
          RELEASE="$(git rev-parse HEAD)"
          cd "$RUNNER_TEMP/releases/score-it-$RELEASE"
          bash load_release.sh
          cp .env.production.example .env.production
          sed -i \
            -e 's/^POSTGRES_DB=.*/POSTGRES_DB=score_it_container_ci/' \
            -e 's/^POSTGRES_USER=.*/POSTGRES_USER=score_it_container_ci/' \
            -e 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-only-password/' \
            -e 's/^DJANGO_SECRET_KEY=.*/DJANGO_SECRET_KEY=ci-only-key/' \
            .env.production
          export POSTGRES_DB=score_it_container_ci
          export POSTGRES_USER=score_it_container_ci
          export DJANGO_SECRET_KEY=ci-only-key
          COMPOSE=(docker compose --env-file .env.production --env-file release.env -f compose.production.yaml)
          "${COMPOSE[@]}" -f compose.proxy.yaml config --quiet
          "${COMPOSE[@]}" up -d --pull never --no-build --wait db
          "${COMPOSE[@]}" run --rm --no-deps --pull never web python manage.py migrate --noinput
          "${COMPOSE[@]}" up -d --pull never --no-build --wait web
          "${COMPOSE[@]}" exec -T web python -c "import urllib.request; [urllib.request.urlopen('http://127.0.0.1:8000' + path, timeout=5).read() for path in ['/healthz/', '/login/', '/static/css/app.css']]"
          test "$(docker network inspect --format '{{.Internal}}' score-it_backend)" = true
