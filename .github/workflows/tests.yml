name: Django tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Django and migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: python manage.py test poker.tests --verbosity 2
      - name: Verify release compatibility and rejection cases
        run: python -m unittest discover -s tests -p 'test_release_verification.py' -v
      - name: Verify temporary TLS profile cleanup and certificate validation
        run: python -m unittest discover -s tests -p 'test_build_tls.py' -v
      - name: Reject obsolete executables in saved Caddy layers
        run: python -m unittest discover -s tests -p 'test_caddy_payload.py' -v
      - name: Reject obsolete gosu, deleted test keys and changed PostgreSQL configuration
        run: python -m unittest discover -s tests -p 'test_postgres_payload.py' -v
      - name: Reject SQLite binaries and package records retained in saved runtime layers
        run: python -m unittest discover -s tests -p 'test_sqlite_payload.py' -v
      - name: Audit locked production Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.production.txt --disable-pip --no-deps

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: score_it_ci
          POSTGRES_USER: score_it_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U score_it_ci -d score_it_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_ENGINE: postgresql
      DB_HOST: 127.0.0.1
      POSTGRES_DB: score_it_ci
      POSTGRES_USER: score_it_ci
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install production dependencies
        run: python -m pip install -r requirements.production.txt
      - name: Transfer SQLite data to a real PostgreSQL database
        run: python tests/check_sqlite_postgres_transfer.py
      - name: Check models and run PostgreSQL tests
        run: |
          python manage.py check --database default
          python manage.py makemigrations --check --dry-run
          python manage.py test poker.tests --verbosity 2
      - name: Verify existing database role migration and least privilege
        run: python tests/check_database_roles.py
      - name: Update build-host Docker and bundled runtime components
        run: |
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo tee /etc/apt/keyrings/docker.asc > /dev/null
          sudo chmod a+r /etc/apt/keyrings/docker.asc
          source /etc/os-release
          printf 'Types: deb\nURIs: https://download.docker.com/linux/ubuntu\nSuites: %s\nComponents: stable\nArchitectures: %s\nSigned-By: /etc/apt/keyrings/docker.asc\n' "$VERSION_CODENAME" "$(dpkg --print-architecture)" | sudo tee /etc/apt/sources.list.d/docker.sources > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          docker version
      - name: Build, load and run the release without external container networking
        run: |
          set -euo pipefail
          source deploy/images.env
          for IMAGE in "$PYTHON_SOURCE_IMAGE" "$POSTGRES_SOURCE_IMAGE" "$GO_SOURCE_IMAGE" "$CADDY_SOURCE_IMAGE"; do
            docker pull --platform linux/amd64 "$IMAGE"
          done
          RELEASE_PULL=0 RELEASE_TLS_COMPAT=1 bash deploy/make_release.sh "$RUNNER_TEMP/releases"
          RELEASE="$(git rev-parse HEAD)"
          cd "$RUNNER_TEMP/releases/score-it-$RELEASE"
          bash load_release.sh
          cp .env.production.example .env.production
          sed -i \
            -e 's/^POSTGRES_DB=.*/POSTGRES_DB=score_it_container_ci/' \
            -e 's/^POSTGRES_USER=.*/POSTGRES_USER=score_it_container_ci/' \
            -e 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-only-password/' \
            -e 's/^DB_PASSWORD=.*/DB_PASSWORD=runtime-ci-only-password/' \
            -e 's/^DB_MIGRATION_PASSWORD=.*/DB_MIGRATION_PASSWORD=migration-ci-only-password/' \
            -e 's/^DJANGO_SECRET_KEY=.*/DJANGO_SECRET_KEY=ci-only-key/' \
            .env.production
          export POSTGRES_DB=score_it_container_ci
          export POSTGRES_USER=score_it_container_ci
          export DJANGO_SECRET_KEY=ci-only-key
          COMPOSE=(docker compose -p score-it-check-ci --env-file .env.production --env-file release.env -f compose.production.yaml -f compose.maintenance.yaml)
          "${COMPOSE[@]}" -f compose.proxy.yaml config --quiet
          "${COMPOSE[@]}" up -d --pull never --no-build --wait db
          "${COMPOSE[@]}" run --rm --no-deps --pull never db-admin python deploy/configure_db_roles.py --apply
          "${COMPOSE[@]}" run --rm --no-deps --pull never migrate
          "${COMPOSE[@]}" up -d --pull never --no-build --wait web
          "${COMPOSE[@]}" exec -T web python manage.py check_database_security
          "${COMPOSE[@]}" exec -T web python -c "import os, importlib.util; assert not {'POSTGRES_USER', 'POSTGRES_PASSWORD', 'DB_MIGRATION_USER', 'DB_MIGRATION_PASSWORD'} & os.environ.keys(); assert all(importlib.util.find_spec(name) is None for name in ('pip', 'ensurepip'))"
          "${COMPOSE[@]}" exec -T web python -c "import urllib.request; [urllib.request.urlopen('http://127.0.0.1:8000' + path, timeout=5).read() for path in ['/healthz/', '/login/', '/static/css/app.css']]"
          python "$GITHUB_WORKSPACE/tests/check_live_security.py" --project score-it-check-ci --release "$RELEASE" --database score_it_container_ci --output "$RUNNER_TEMP/live-security.json"
          source release.env
          python "$GITHUB_WORKSPACE/tests/check_postgres_runtime.py" --image "$POSTGRES_IMAGE" --source-image "$POSTGRES_SOURCE_IMAGE" --go-image "$GO_SOURCE_IMAGE" </dev/null | tee "$RUNNER_TEMP/postgres-runtime.txt"
          for IMAGE in "$SCORE_IT_IMAGE" "$POSTGRES_IMAGE" "$CADDY_IMAGE"; do
            docker image inspect --format '{{json .Config.Env}}' "$IMAGE" | python -c 'import json, sys; names = {v.split("=", 1)[0] for v in json.load(sys.stdin)}; assert not {"GODEBUG", "OPENSSL_CONF"} & names, names'
          done
          python "$GITHUB_WORKSPACE/tests/check_caddy_runtime.py" --image "$CADDY_IMAGE" --client-image "$SCORE_IT_IMAGE" </dev/null
          grep -Fx 'RELEASE_TLS_COMPAT=1' security/build-options.txt
          docker run --rm --network none -v "$PWD/Caddyfile.score-it.example:/etc/caddy/Caddyfile:ro" "$CADDY_IMAGE" caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile > "$RUNNER_TEMP/caddy-adapted.json"
          test "$(docker network inspect --format '{{.Internal}}' score-it-check-ci_backend)" = true
      # Checkout after make_release.sh, which requires a clean source tree.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Parabe11um/kidsTime
          ref: 08dac907114be118b57ea281084f0b2bda88879e
          path: .ci-kidstime
          persist-credentials: false
      - name: Verify both shared proxy routes and log privacy
        run: |
          RELEASE="$(git rev-parse HEAD)"
          source "$RUNNER_TEMP/releases/score-it-$RELEASE/release.env"
          python .ci-kidstime/tests/check_caddy_security.py --image "$CADDY_IMAGE" --backend-image "$SCORE_IT_IMAGE" </dev/null
      - name: Retain vulnerability reports and SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-security-reports
          path: |
            ${{ runner.temp }}/releases/*/security/
            ${{ runner.temp }}/live-security.json
            ${{ runner.temp }}/postgres-runtime.txt
          if-no-files-found: warn
