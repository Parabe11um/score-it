name: score-it

services:
  db:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE in .env.production}
    pull_policy: never
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    image: ${SCORE_IT_IMAGE:?Set SCORE_IT_IMAGE in .env.production}
    pull_policy: never
    env_file: .env.production
    environment:
      DJANGO_DEBUG: "0"
      DB_ENGINE: postgresql
      DB_HOST: db
      DB_PORT: "5432"
    expose:
      - "8000"
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=5).read()"]
      interval: 15s
      timeout: 7s
      start_period: 20s
      retries: 5
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  backend:
    internal: true

volumes:
  postgres_data:
