<svg class="board-tool-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"

    {% elif tool == "hand" %}<path d="M8 13V5a1.5 1.5 0 0 1 3 0v5-7a1.5 1.5 0 0 1 3 0v7-5a1.5 1.5 0 0 1 3 0v6-3a1.5 1.5 0 0 1 3 0v6a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-3l-3-5a1.5 1.5 0 0 1 2.5-1.5L8 13Z"/>

    {% elif tool == "square" %}<rect x="4.5" y="4.5" width="15" height="15" rx="1.5"/>

        <path class="board-fullscreen__exit" d="M4 9h5V4m11 5h-5V4m-6 16v-5H4m11 5v-5h5"/>
