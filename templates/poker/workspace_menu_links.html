<nav aria-label="Разделы приложения">
    <ul class="workspace-nav">
        <li>
            <a class="workspace-nav__link" href="{% url 'poker:dashboard' %}"{% if projects_current %} aria-current="{{ projects_current }}"{% endif %}>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                    <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                </svg>
                <span>Проекты</span>
            </a>
            {% if projects %}
                <ul class="workspace-nav__projects" aria-label="Ваши проекты">
                    {% for item in projects %}
                        <li><a class="workspace-nav__link workspace-nav__project" href="{% url 'poker:project_overview' item.pk %}"{% if item.pk == selected_project_id %} aria-current="{{ project_current }}"{% endif %}>{{ item.name }}</a></li>
                    {% endfor %}
                </ul>
            {% endif %}
        </li>
        <li>
            <a class="workspace-nav__link" href="{% url 'poker:user_settings' %}"{% if in_account %} aria-current="page"{% endif %}>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                    <circle cx="12" cy="8" r="3.25"/><path d="M5 20v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"/>
                </svg>
                <span>Пользователь</span>
            </a>
        </li>
    </ul>
</nav>
