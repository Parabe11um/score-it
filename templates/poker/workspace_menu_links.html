<nav aria-label="Разделы приложения">
    <ul class="workspace-nav">
        {% for item in items %}
            <li>
                <a class="workspace-nav__link" href="{{ item.url }}"{% if item.current %} aria-current="{{ item.current }}"{% endif %}>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        {% if item.icon == "user" %}
                            <circle cx="12" cy="8" r="3.25"/><path d="M5 20v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"/>
                        {% elif item.icon == "projects" %}
                            <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        {% elif item.icon == "voting" %}
                            <path d="M4 13h16v7H4zM5 13l2-4h3m4 0h3l2 4M9 6l2 2 4-4"/>
                        {% elif item.icon == "sprints" %}
                            <rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4m8-4v4M4 10h16M9 15h6"/>
                        {% elif item.icon == "teams" %}
                            <circle cx="9" cy="7.5" r="3"/><path d="M3 19v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2m1-14a3 3 0 0 1 0 6m2 2a4 4 0 0 1 3 4v2"/>
                        {% endif %}
                    </svg>
                    <span>{{ item.label }}</span>
                </a>
            </li>
        {% endfor %}
    </ul>
</nav>
